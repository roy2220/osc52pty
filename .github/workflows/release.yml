name: Release prebuilt binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          tagged_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ "$tagged_commit" != "$checked_out_commit" ]]; then
            echo "Tag $RELEASE_TAG does not point to the checked-out commit." >&2
            exit 1
          fi

      - name: Build archives and checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist stage
          for arch in amd64 arm64; do
            archive_name="osc52pty_${RELEASE_TAG}_darwin_${arch}"
            package_dir="stage/${archive_name}"
            mkdir -p "$package_dir"

            env CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w' -o "${package_dir}/osc52pty" .
            cp LICENSE README.md "$package_dir/"
            tar -C stage -czf "dist/${archive_name}.tar.gz" "$archive_name"
          done

          (cd dist && shasum -a 256 ./*.tar.gz > checksums.txt)

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/*.tar.gz dist/checksums.txt \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
